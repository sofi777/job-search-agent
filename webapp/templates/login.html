{% extends "base.html" %}
{% block title %}Log in - Dream Job Landing{% endblock %}
{% block body %}
<div class="center-screen">
  <div class="page-narrow" style="text-align:center;">
    <h1>Dream Job Landing</h1>
    <p class="text-muted" style="margin-bottom:var(--space-6);">Never miss the job that actually fits you.</p>
    <form method="post" style="text-align:left;max-width:320px;margin:0 auto;">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" value="{{ user.email if user else 'jamie@example.com' }}">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" placeholder="anything works (demo login)">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
