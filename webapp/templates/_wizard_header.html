<div class="wizard-header">
  <div class="brand">Dream Job Landing</div>
  <div class="rule"></div>
  <div class="step-label">Step {{ step_index + 1 }} of {{ step_count }}</div>
</div>
<div class="progress-dots">
  {% for i in range(step_count) %}
    <div class="{{ 'done' if i <= step_index else '' }}"></div>
  {% endfor %}
</div>
