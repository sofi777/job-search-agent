{% extends "base.html" %}
{% block title %}{{ label }} - Dream Job Landing{% endblock %}
{% block body %}
{% include "_nav.html" %}

<div class="detail-card">
  <a href="{{ url_for('job_detail', job_id=job.id) }}" class="text-muted" style="text-decoration:none;">&larr; Back to {{ job.title }}</a>
  <h1 style="margin-top:var(--space-4);">{{ label }}</h1>
  <p class="text-muted">For {{ job.title }} at {{ job.company }}</p>

  <form method="post">
    <textarea class="input" name="text" style="min-height:320px;font-size:14px;line-height:1.6;">{{ text }}</textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:var(--space-3);">
      <button type="submit" name="action" value="regenerate" class="btn btn-ghost">Regenerate</button>
      <button type="submit" name="action" value="save" class="btn btn-primary">Save &amp; close</button>
    </div>
  </form>
</div>
{% endblock %}
